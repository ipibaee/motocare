  <!-- MotoCare Supabase Configurations (Inlined for maximum reliability) -->
  <script>
    (function() {
      let supabase = null;
      let errorMsg = null;
      try {
        const getSupabaseKeys = () => {
          const url = (typeof window !== 'undefined' && window.VITE_SUPABASE_URL) || '';
          const key = (typeof window !== 'undefined' && window.VITE_SUPABASE_ANON_KEY) || '';
          return { url: url.trim(), key: key.trim() };
        };

        const { url, key } = getSupabaseKeys();

        if (typeof window !== 'undefined') {
          try {
            localStorage.removeItem('motocare_supabase_url');
            localStorage.removeItem('motocare_supabase_anon_key');
          } catch (e) {}

          if (!window.supabase) {
            errorMsg = 'Library Supabase gagal dimuat dari CDN (unpkg.com). Periksa koneksi internet atau matikan adblocker.';
          } else if (!url || !key) {
            errorMsg = 'URL atau Anon Key Supabase kosong. Harap isi Environment Variables VITE_SUPABASE_URL dan VITE_SUPABASE_ANON_KEY di dashboard Vercel, lalu redeploy.';
          } else {
            try {
              supabase = window.supabase.createClient(url, key, {
                auth: {
                  persistSession: true,
                  autoRefreshToken: true
                }
              });
              console.log("Supabase client initialized successfully!");
            } catch (err) {
              errorMsg = 'Gagal inisialisasi Supabase: ' + (err.message || err);
            }
          }
        }
      } catch (globalErr) {
        errorMsg = 'Gagal memproses skrip client: ' + (globalErr.message || globalErr);
      }
      window.supabaseClient = supabase;
      window.supabaseError = errorMsg;
    })();
  </script>

  <script>
    (function() {
      let isSupabaseOffline = false;
      const isSupabaseConfigured = () => {
        return window.supabaseClient !== null && !isSupabaseOffline;
      };

      const withTimeout = async (promise, timeoutMs = 2000) => {
        return Promise.race([
          promise,
          new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), timeoutMs))
        ]);
      };

      const getGuestData = () => {
        const key = 'motocare_guest_data_v1';
        try {
          const data = localStorage.getItem(key);
          if (data) return JSON.parse(data);
        } catch (e) {
          console.error("Error reading guest data", e);
        }
        return {
          vehicles: [],
          components: {},
          service_logs: [],
          shops: [],
          trips: []
        };
      };

      const saveGuestData = (data) => {
        const key = 'motocare_guest_data_v1';
        localStorage.setItem(key, JSON.stringify(data));
      };

      const databaseService = {
        // --- VEHICLES ---
        async getVehicles(userId) {
          if (isSupabaseConfigured() && userId) {
            try {
              const res = await withTimeout(
                window.supabaseClient
                  .from('vehicles')
                  .select('*')
                  .order('created_at', { ascending: true }),
                2000
              );
              if (res && !res.error) {
                return res.data.map(v => ({
                  id: v.id,
                  name: v.name,
                  brand: v.brand || '',
                  type: v.type || '',
                  year: v.year || '',
                  plate: v.plate_number || '',
                  odo: v.current_odometer || 0,
                  initialOdo: v.current_odometer || 0,
                  notes: v.notes || ''
                }));
              }
              console.error("Supabase getVehicles error:", res.error);
            } catch (err) {
              console.error("Supabase getVehicles failed, falling back:", err);
              isSupabaseOffline = true;
              if (window.showOfflineToast) window.showOfflineToast();
            }
          }
          const guestData = getGuestData();
          return guestData.vehicles || [];
        },

        async createVehicle(userId, vehicle) {
          if (isSupabaseConfigured() && userId) {
            const dbVehicle = {
              name: vehicle.name,
              brand: vehicle.brand || '',
              type: vehicle.type || '',
              year: parseInt(vehicle.year, 10) || null,
              plate_number: vehicle.plate || '',
              current_odometer: parseInt(vehicle.odo, 10) || 0,
              user_id: userId
            };
            try {
              const res = await withTimeout(
                window.supabaseClient
                  .from('vehicles')
                  .insert([dbVehicle])
                  .select(),
                2000
              );
              if (res && !res.error && res.data && res.data.length > 0) {
                const v = res.data[0];
                return {
                  id: v.id,
                  name: v.name,
                  brand: v.brand || '',
                  type: v.type || '',
                  year: v.year || '',
                  plate: v.plate_number || '',
                  odo: v.current_odometer || 0,
                  initialOdo: v.current_odometer || 0,
                  notes: ''
                };
              }
              console.error("Supabase createVehicle error:", res.error);
            } catch (err) {
              console.error("Supabase createVehicle failed:", err);
              isSupabaseOffline = true;
              if (window.showOfflineToast) window.showOfflineToast();
            }
          }
          const guestData = getGuestData();
          if (!vehicle.id) {
            vehicle.id = 'v_' + Date.now();
          }
          guestData.vehicles.push(vehicle);
          saveGuestData(guestData);
          return vehicle;
        },

        async updateVehicle(userId, vehicle) {
          if (isSupabaseConfigured() && userId && !vehicle.id.startsWith('v_')) {
            const dbVehicle = {
              name: vehicle.name,
              brand: vehicle.brand || '',
              type: vehicle.type || '',
              year: parseInt(vehicle.year, 10) || null,
              plate_number: vehicle.plate || '',
              current_odometer: parseInt(vehicle.odo, 10) || 0
            };
            try {
              const res = await withTimeout(
                window.supabaseClient
                  .from('vehicles')
                  .update(dbVehicle)
                  .eq('id', vehicle.id)

// Error Boundary Component
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }

  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }

  componentDidCatch(error, errorInfo) {
    console.error("ErrorBoundary caught an error", error, errorInfo);
  }

  render() {
    if (this.state.hasError) {
      return (
        <div className="flex-1 flex items-center justify-center p-6 bg-[#050506] text-white min-h-screen">
          <div className="glass-urgent rounded-[32px] p-6 max-w-md w-full text-center space-y-4 border border-iosRed/30 shadow-2xl">
            <div className="w-12 h-12 rounded-full bg-iosRed/20 text-iosRed flex items-center justify-center mx-auto">
              <span className="inline-flex items-center justify-center"><i data-lucide="shield-alert" className="w-6 h-6"></i></span>
            </div>
            <h3 className="text-lg font-bold text-white">Terjadi Kesalahan</h3>
            <p className="text-xs text-iosGray">Aplikasi mendeteksi error runtime. Anda dapat mencoba memuat ulang halaman.</p>
            <pre className="bg-black/40 p-3 rounded-ios-sm text-[10px] text-iosRed text-left overflow-x-auto whitespace-pre-wrap max-h-40">
              {this.state.error ? this.state.error.toString() : 'Unknown Error'}
            </pre>
            <button 
              onClick={() => window.location.reload()}
              className="w-full bg-iosBlue hover:bg-iosBlue/95 text-white py-3.5 rounded-full font-bold text-xs"
            >
              Muat Ulang Aplikasi
            </button>
          </div>
        </div>
      );
    }

    return this.props.children;
  }
}

const getCustomIcon = (name = '', componentName = '') => {
  const normalizedName = (name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const normalizedComp = (componentName || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  
  if (normalizedComp.includes('filterudara')) return CUSTOM_ICONS.filterUdara;
  if (normalizedComp.includes('aki')) return CUSTOM_ICONS.battery;
  if (normalizedComp.includes('cairanpendingin') || normalizedComp.includes('radiator') || normalizedComp.includes('pendingin')) return CUSTOM_ICONS.coolant;
  if (normalizedComp.includes('vbelt') || normalizedComp.includes('tensioner')) return CUSTOM_ICONS.vbelt;
  if (normalizedComp.includes('roller')) return CUSTOM_ICONS.roller;
  if (normalizedComp.includes('filterbahanbakar') || normalizedComp.includes('filterbensin')) return CUSTOM_ICONS.fuelFilter;
  if (normalizedComp.includes('busi')) return CUSTOM_ICONS.sparkPlug;
  if (normalizedComp.includes('filteroli')) return CUSTOM_ICONS.oilFilter;
  if (normalizedComp.includes('olimesin') || normalizedComp.includes('olitransmisi') || normalizedComp.includes('olishock') || normalizedComp.includes('oli')) return CUSTOM_ICONS.oilCan;
  if (normalizedComp.includes('cakramrem') || normalizedComp.includes('cakram')) return CUSTOM_ICONS.brakeDisc;
  if (normalizedComp.includes('kampasrem')) return CUSTOM_ICONS.brakePad;
  if (normalizedComp.includes('minyakrem')) return CUSTOM_ICONS.brakeFluid;
  if (normalizedComp.includes('ban')) return CUSTOM_ICONS.tire;

  if (normalizedName === 'compass' && normalizedComp === '') return CUSTOM_ICONS.filterUdara;
  if (normalizedName === 'zap') return CUSTOM_ICONS.battery;
  if (normalizedName === 'thermometer') return CUSTOM_ICONS.coolant;
  if (normalizedName === 'award') return CUSTOM_ICONS.vbelt;
  if (normalizedName === 'fuel') return CUSTOM_ICONS.fuelFilter;
  if (normalizedName === 'droplet') return CUSTOM_ICONS.oilCan;
  if (normalizedName === 'disc') return CUSTOM_ICONS.brakeDisc;
  if (normalizedName === 'circledot') return CUSTOM_ICONS.roller;

  return null;
};

const IconComponent = ({ name, className = 'w-5 h-5', componentName = '' }) => {
  const customIconFn = getCustomIcon(name, componentName);
  if (customIconFn) {
    return customIconFn(className);
  }
  
  const iconName = name || 'Wrench';
  const kebabName = iconName
    .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
    .replace(/([A-Z])([A-Z][a-z])/g, '$1-$2')
    .toLowerCase();
  
  return (
    <span 
      key={`${kebabName}-${className}`}
      className="inline-flex items-center justify-center"
      dangerouslySetInnerHTML={{ __html: `<i data-lucide="${kebabName}" class="${className}"></i>` }}
    />
  );
};

const getComponentStatus = (comp, currentOdo) => {
  const elapsedKm = Math.max(0, currentOdo - comp.lastServiceOdo);
  const remainingKm = Math.max(0, comp.intervalKm - elapsedKm);
  
  const lastServiceDate = new Date(comp.lastServiceDate);
  const nextServiceDate = new Date(lastServiceDate);
  nextServiceDate.setMonth(nextServiceDate.getMonth() + parseInt(comp.intervalMonths || comp.interval_month || 6, 10));
  
  const timeDiff = nextServiceDate.getTime() - CURRENT_DATE.getTime();
  const remainingDays = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
  
  const isUrgent = remainingKm <= 0 || remainingDays <= 0;
  
  return {
    remainingKm,
    remainingDays,
    nextServiceDate,
    isUrgent,
    elapsedKm
  };
};

      const updatedComps = currentComponents.map(c => {

            lastServiceOdo: newLog.odo,

        return c;

        ...prev,
        [activeVehicleId]: updatedComps
      }));

      if (newLog.odo > currentVehicle.odo) {

  const handleExportData = () => {
    const data = {
      vehicles,
      vehicleComponents,
      serviceHistory,

    };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));

    downloadAnchor.setAttribute("download", `motocare_backup_${new Date().toISOString().split('T')[0]}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
    showToast('Data berhasil diekspor ke JSON!');
  };

  const handleImportData = (e) => {
    const fileReader = new FileReader();
    fileReader.onload = async (event) => {
      try {
        const parsedData = JSON.parse(event.target.result);
        if (parsedData.vehicles) {
          const userId = user?.id || null;
          
          for (const v of parsedData.vehicles) {
            await window.databaseService.createVehicle(userId, v);
            if (parsedData.vehicleComponents && parsedData.vehicleComponents[v.id]) {
              for (const c of parsedData.vehicleComponents[v.id]) {
                await window.databaseService.createComponent(userId, v.id, c);
              }
            }
          }
          if (parsedData.serviceHistory) {
            for (const log of parsedData.serviceHistory) {
              await window.databaseService.createServiceLog(userId, log.vehicleId, log);
            }
          }
          if (parsedData.customShops) {
            for (const s of parsedData.customShops) {
              await window.databaseService.createShop(userId, s);
            }
          }
          if (parsedData.tripsLog) {
            for (const t of parsedData.tripsLog) {
              await window.databaseService.createTrip(userId, t);
            }
          }
          
          await loadAllData();
          showToast('Data berhasil diimpor!');
          setActiveModal(null);
        } else {
          showToast('Format JSON tidak valid!', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Gagal memproses file JSON!', 'error');
      }
    };
    if (e.target.files && e.target.files[0]) {
      fileReader.readAsText(e.target.files[0]);
    }
  };

    if (!file) return;

    const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'];
    if (!validTypes.includes(file.type)) {
      showToast('Format file harus JPG, JPEG, PNG, atau WEBP.', 'error');
      return;
    }

    const reader = new FileReader();
    reader.onload = (uploadEvent) => {
      setCroppingSrc(uploadEvent.target.result);
      setCropX(0);
      setCropY(0);
      setCropZoom(1);
      setShowCropper(true);
      e.target.value = '';
    };
    reader.readAsDataURL(file);
  };

    const key = userId ? `motocare_profile_pic_${userId}` : 'motocare_profile_pic_guest';
    localStorage.removeItem(key);
    setProfilePic(null);
    showToast('Foto profil dihapus.');

    if (window.supabaseClient && userId) {
      try {
        await window.supabaseClient.storage.from('avatars').remove([`avatar_${userId}.webp`]);

        console.warn("Failed to remove avatar from Supabase storage:", err);

    const success = await window.databaseService.migrateLocalDataToSupabase(user.id);
    if (success) {
      showToast('Migrasi berhasil! Memuat ulang data...', 'success');
      localStorage.removeItem('motocare_vehicles');
      localStorage.removeItem('motocare_components');
      localStorage.removeItem('motocare_history');

      try {
        const newTripLog = {
          vehicleId: activeVehicleId,
          date: CURRENT_DATE_STRING,
          distance: distance,
          duration: tripSeconds,
          origin: 'Rute Otomatis',
          destination: 'Tujuan Lacak',
          notes: `Lacak otomatis simulasi perjalanan.`
        };

        const saved = await window.databaseService.createTrip(userId, newTripLog);
        setTripsLog(prev => [saved, ...prev]);

        const updatedVehicle = { ...currentVehicle, odo: currentVehicle.odo + distance };
        await window.databaseService.updateVehicle(userId, updatedVehicle);
        setVehicles(prev => prev.map(v => v.id === activeVehicleId ? updatedVehicle : v));

  const renderCropModal = () => {
    if (!showCropper || !croppingSrc) return null;

    const handleSaveCrop = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const img = new Image();
      img.onload = () => {
        // Clear background
        ctx.fillStyle = '#1C1C1E';
        ctx.fillRect(0, 0, 512, 512);

        const scale = 512 / 240; // Scale factor from 240px preview to 512px canvas
        const cx = 256;
        const cy = 256;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.translate(cropX * scale, cropY * scale);
        ctx.scale(cropZoom, cropZoom);

        let drawW = 512;
        let drawH = 512;
        if (imgAspect > 1) {
          drawW = 512 * imgAspect;
        } else {
          drawH = 512 / imgAspect;
        }

        ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
        ctx.restore();

        // Compress to WebP with 85% quality
        canvas.toBlob(async (blob) => {
          if (!blob) return;
          
          const base64 = canvas.toDataURL('image/webp', 0.85);
          const userId = user?.id || null;
          const key = userId ? `motocare_profile_pic_${userId}` : 'motocare_profile_pic_guest';
          
          localStorage.setItem(key, base64);
          setProfilePic(base64);
          showToast('Foto profil diperbarui!');
          setShowCropper(false);

          if (window.supabaseClient && userId) {
            try {
              const { error } = await window.supabaseClient.storage
                .from('avatars')
                .upload(`avatar_${userId}.webp`, blob, {
                  upsert: true,
                  contentType: 'image/webp'
                });
              
              if (!error) {
                const { data } = window.supabaseClient.storage.from('avatars').getPublicUrl(`avatar_${userId}.webp`);
                if (data && data.publicUrl) {
                  const urlWithBuster = `${data.publicUrl}?t=${Date.now()}`;
                  localStorage.setItem(key, urlWithBuster);
                  setProfilePic(urlWithBuster);
                }
              }
            } catch (storageErr) {
              console.warn("Supabase Storage upload failed, fallback to local storage:", storageErr);
            }
          }
        }, 'image/webp', 0.85);
      };
      img.src = croppingSrc;
    };

    const handleMouseDown = (e) => {
      setIsDragging(true);
      setDragStart({ x: e.clientX - cropX, y: e.clientY - cropY });
    };

    const handleMouseMove = (e) => {
      if (!isDragging) return;
      setCropX(e.clientX - dragStart.x);
      setCropY(e.clientY - dragStart.y);
    };

    const handleMouseUp = () => setIsDragging(false);
    const handleMouseLeave = () => setIsDragging(false);

    const handleTouchStart = (e) => {
      if (e.touches.length === 1) {
        setIsDragging(true);
        setDragStart({ x: e.touches[0].clientX - cropX, y: e.touches[0].clientY - cropY });
      }
    };

    const handleTouchMove = (e) => {
      if (!isDragging) return;
      setCropX(e.touches[0].clientX - dragStart.x);
      setCropY(e.touches[0].clientY - dragStart.y);
    };

    const handleTouchEnd = () => setIsDragging(false);

    return (
      <div className="fixed inset-0 z-[140] flex items-center justify-center p-4">
        {/* Overlay */}
        <div className="absolute inset-0 bg-black/80 backdrop-blur-sm animate-fadeIn" onClick={() => setShowCropper(false)} />
        
        {/* Container */}
        <div className="relative z-10 w-full max-w-sm bg-[#1C1C1E] border border-white/[0.12] rounded-[32px] p-6 text-center animate-scaleUp">
          <h3 className="text-base font-bold text-white mb-1">Sesuaikan Foto Profil</h3>
          <p className="text-xs text-iosGray mb-6">Geser dan perbesar foto agar pas di dalam lingkaran.</p>
          
          {/* Crop Mask Area */}
          <div className="flex justify-center mb-6">
            <div className="relative w-64 h-64 flex items-center justify-center bg-black/50 border border-white/[0.08] rounded-2xl overflow-hidden select-none">
              {/* Circular border guide */}
              <div className="absolute inset-0 border-[12px] border-[#1C1C1E]/90 z-20 pointer-events-none rounded-2xl">
                <div className="w-full h-full border border-white/25 rounded-full animate-pulse" />
              </div>
              
              {/* Drag Container */}
              <div 
                className="w-[240px] h-[240px] rounded-full overflow-hidden flex items-center justify-center bg-[#141416] cursor-move touch-none z-10"

  const renderMonthlyCostChart = () => {
    const activeHistory = serviceHistory.filter(h => h.vehicleId === activeVehicleId);
    const hasAnyCost = activeHistory.some(h => (h.cost || 0) > 0);

    if (!hasAnyCost) {
      return (
        <div className="glass rounded-[28px] p-5 text-center space-y-1.5 overflow-hidden w-full max-w-full select-none">
          <p className="text-xs font-bold text-white">Belum ada biaya servis.</p>
          <p className="text-[10px] text-iosGray leading-relaxed">
            Isi biaya saat menambah riwayat servis.
          </p>
        </div>
      );
    }

    // Generate last 3 months dynamically (ends with current month)
    const now = new Date();
    const monthsData = [];
    for (let i = 2; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const label = d.toLocaleDateString('id-ID', { month: 'short' });
      const yearMonthKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      monthsData.push({
        label,
        key: yearMonthKey,
        cost: 0,
        isCurrent: i === 0
      });
    }

    // Populate costs
    activeHistory.forEach(h => {
      if (!h.date) return;
      const logDate = new Date(h.date);
      if (isNaN(logDate.getTime())) return;
      const key = `${logDate.getFullYear()}-${String(logDate.getMonth() + 1).padStart(2, '0')}`;
      const found = monthsData.find(m => m.key === key);
      if (found) {
        found.cost += (h.cost || 0);
      }
    });

    const maxCost = Math.max(...monthsData.map(m => m.cost), 1); // Avoid division by zero
    const currentMonthCost = monthsData[2].cost;

    return (
      <div className="glass rounded-[28px] p-3.5 sm:p-4.5 space-y-3 sm:space-y-4 overflow-hidden w-full max-w-full select-none monthly-chart-card">
        <div className="flex items-end justify-between h-16 sm:h-20 pt-2 px-1 gap-2 sm:gap-2.5 overflow-hidden w-full">
          {monthsData.map((m, idx) => {
            const pct = Math.min(100, Math.max(8, Math.round((m.cost / maxCost) * 100)));
            return (
              <div key={idx} className="flex flex-col items-center gap-1 sm:gap-1.5 flex-1 relative min-w-0 group">
                <div 
                  className={`w-full rounded-t-md transition-all duration-300 ${
                    m.isCurrent 
                      ? 'bg-iosBlue shadow-[0_0_10px_rgba(59,141,255,0.4)]' 
                      : 'bg-white/[0.08] hover:bg-iosBlue/40'
                  }`}
                  style={{ height: `${pct}%` }}
                  title={`Rp ${m.cost.toLocaleString('id-ID')}`}
                ></div>
                <span className={`text-[9px] truncate max-w-full ${m.isCurrent ? 'text-white font-bold' : 'text-iosGray'}`}>
                  {m.label}
                </span>
              </div>
            );
          })}
        </div>

        <div className="space-y-1.5 sm:space-y-2 pt-1.5 border-t border-white/[0.04] text-[10px] sm:text-[11px] w-full overflow-hidden">
          <div className="flex justify-between items-center gap-2">
            <span className="text-iosGray truncate">Estimasi Bulan Ini</span>
            <span className="font-bold text-iosBlue flex-shrink-0">Rp {currentMonthCost.toLocaleString('id-ID')}</span>
          </div>
          <div className="flex justify-between items-center gap-2">
            <span className="text-iosGray truncate">Total Biaya 3 Bulan</span>
            <span className="font-bold text-white flex-shrink-0">Rp {monthsData.reduce((sum, m) => sum + m.cost, 0).toLocaleString('id-ID')}</span>
          </div>
          <p className="text-[8px] sm:text-[9px] text-iosGray/60 italic text-center pt-1.5 truncate">

        </div>
      </div>
    );
  };

            {activeTab === 'ride' && vehicles.length > 0 && (
              <div className="w-full">
                {/* Desktop Grid Layout only */}
                <div className="hidden md:block">
                  {renderDesktopDashboardMetrics()}
                </div>
              </div>
            )}
            {renderTabContent()}
          </div>

          {activeTab === 'ride' && vehicles.length > 0 && renderDesktopRightPanel()}
        </div>
      </div>

      {renderMobileBottomNav()}

      {!selectionMode && vehicles.length > 0 && (
        <button 
          onClick={() => setActiveTab('search')}
          className="mobile-search-btn glass-strong flex items-center justify-center text-iosBlue shadow-2xl active:scale-90 transition-transform cursor-pointer md:hidden"
        >
          <Search className="w-5 h-5 text-white" />
        </button>
      )}

      {selectionMode && (
        <div className="fixed bottom-[16px] left-[50%] -translate-x-[50%] w-[calc(100%-32px)] max-w-[360px] glass-strong rounded-full p-4 flex items-center justify-between shadow-2xl z-[120] animate-slideUp md:hidden">
          <button 
            onClick={handleBatchDelete}
            disabled={selectedComponents.length === 0}
            className="w-11 h-11 bg-iosRed/10 hover:bg-iosRed/20 text-iosRed rounded-full flex items-center justify-center disabled:opacity-40 transition-colors"
          >
            <Trash2 className="w-5 h-5" />
          </button>
          <div className="flex-1 text-center">
            <span className="text-xs font-bold text-white block">{selectedComponents.length} terpilih</span>
            <span className="text-[9px] text-iosGray">Servis {formatDistance(currentVehicle.odo)}</span>
          </div>
          <button 
            onClick={handleBatchService}
            disabled={selectedComponents.length === 0}
            className="bg-iosBlue hover:bg-iosBlue/95 text-white font-bold text-[10px] py-2.5 px-4.5 rounded-full disabled:opacity-40 shadow transition-all active:scale-95"
          >
            Servis ({selectedComponents.length})
          </button>
        </div>
      )}

      {/* Render modals */}
      {renderMobileSearchOverlay()}
      {renderOdoSettingModal()}
      {renderShopDetailSheet()}
      {renderComponentDetailModal()}
      {renderComponentFormModal()}
      {renderAddCustomComponentModal()}
      {renderAddVehicleModal()}
      {renderAddHistoryModal()}
      {renderAddShopModal()}
      {renderAddStandardComponentListModal()}
      {renderEditVehicleModal()}
      {renderEditComponentModal()}
      {renderEditHistoryModal()}
      {renderEditShopModal()}
      {renderEditTripModal()}
      {renderAddTripModal()}
      {renderDeleteConfirmModal()}
      {renderResetConfirmModal()}
      {renderMigrationModal()}

      {/* Toast popup */}
      {toast && (
        <div className="fixed top-5 left-4 right-4 md:left-1/2 md:right-auto md:-translate-x-1/2 z-[200] md:max-w-[420px] w-auto md:w-auto bg-iosCard/90 backdrop-blur-md border border-white/[0.12] shadow-2xl rounded-full py-2.5 px-5 flex items-center gap-2.5 animate-popover">
          <div className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${toast.type === 'error' ? 'bg-iosRed' : 'bg-iosGreen animate-pulse'}`}></div>
          <span className="text-xs font-bold text-white">{toast.message}</span>
        </div>
      )}
    </div>
  );
}

// Mount React App to DOM root
const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);

</script>
</body>
</html>

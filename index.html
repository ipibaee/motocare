    /* ----------------------------------------------------
       LIQUID GLASS / GLASSMORPHISM REUSABLE CLASSES
       ---------------------------------------------------- */
    
    /* Base Glass Card */
    .glass, .glass-card {
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,0.12), transparent 32%),
        linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.025)),
        rgba(30,30,32,0.78);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow:
        0 12px 34px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.14);
      position: relative;
    }

    /* Strong Glass Panel */
    .glass-panel, .glass-strong {
      background:
        linear-gradient(145deg, rgba(255,255,255,0.10), rgba(255,255,255,0.035)),
        rgba(28,28,30,0.72);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow:
        0 18px 50px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 -1px 0 rgba(255,255,255,0.04);
      position: relative;
    }

    /* Glass Pill for headers and tags */
    .glass-pill {
      background:
        linear-gradient(145deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04)),
        rgba(28,28,30,0.70);
      backdrop-filter: blur(20px) saturate(170%);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow:
        0 10px 30px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.20);
      position: relative;
    }

    /* Urgent Glass Card */
    .glass-urgent {
      background:
        radial-gradient(circle at 15% 0%, rgba(255,110,120,0.22), transparent 35%),
        linear-gradient(145deg, rgba(120,20,28,0.50), rgba(38,8,12,0.72));
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,90,100,0.38);
      box-shadow:
        0 16px 42px rgba(0,0,0,0.45),
        0 0 34px rgba(255,70,90,0.12),
        inset 0 1px 0 rgba(255,255,255,0.13);
      position: relative;
    }

    /* Fixed Liquid Glass Bottom Nav (Mobile Only) */
    .glass-bottom-nav {
      background:
        linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04)),
        rgba(28,28,30,0.68);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        0 18px 60px rgba(0,0,0,0.58),

        inset 0 -1px 0 rgba(255,255,255,0.06);
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 360px;
      height: 72px;
      border-radius: 999px;
      z-index: 100;
      overflow: hidden;
    }

    /* Reflection Pseudo Element (iOS effect) */
    .glass::before, .glass-card::before, .glass-panel::before, .glass-strong::before, .glass-bottom-nav::before, .glass-urgent::before, .glass-pill::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.03) 40%, rgba(255, 255, 255, 0));
      pointer-events: none;
      z-index: 0;
    }

      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 80, 90, 0.05) 40%, rgba(255, 255, 255, 0));
    }

      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Floating search button sizing */
    .mobile-search-btn {

    /* Media query to lock search button to the right of bottom nav pill */
    @media (min-width: 392px) {

      color: #ffffff;

    .glass-input:focus {

      border-color: #3B8DFF;
      box-shadow: 0 0 12px rgba(59, 141, 255, 0.25);

    .component-card {

    @keyframes popoverEntrance {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }

      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {

    }

      from { transform: scale(0.95); opacity: 0; }

  <script type="text/babel">
    // Error Boundary Component
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught an error", error, errorInfo);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="flex-1 flex items-center justify-center p-6 bg-[#050506] text-white min-h-screen">
              <div className="glass-urgent rounded-[32px] p-6 max-w-md w-full text-center space-y-4 border border-iosRed/30 shadow-2xl">
                <div className="w-12 h-12 rounded-full bg-iosRed/20 text-iosRed flex items-center justify-center mx-auto">
                  <IconComponent name="ShieldAlert" className="w-6 h-6" />
                </div>
                <h3 className="text-lg font-bold text-white">Terjadi Kesalahan</h3>
                <p className="text-xs text-iosGray">Aplikasi mendeteksi error runtime. Anda dapat mencoba memuat ulang halaman.</p>
                <pre className="bg-black/40 p-3 rounded-ios-sm text-[10px] text-iosRed text-left overflow-x-auto whitespace-pre-wrap max-h-40">
                  {this.state.error ? this.state.error.toString() : 'Unknown Error'}
                </pre>
                <button 
                  onClick={() => window.location.reload()}
                  className="w-full bg-iosBlue hover:bg-iosBlue/95 text-white py-3.5 rounded-full font-bold text-xs"
                >
                  Muat Ulang Aplikasi
                </button>
              </div>
            </div>
          );
        }

        return this.props.children;
      }
    }

    // Helper to render icon based on name using Vanilla Lucide
    const IconComponent = ({ name, className = 'w-5 h-5' }) => {
      const iconName = name || 'Wrench';
      const kebabName = iconName
        .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
        .replace(/([A-Z])([A-Z][a-z])/g, '$1-$2')
        .toLowerCase();
      
      return (
        <span 
          key={`${kebabName}-${className}`}
          className="inline-flex items-center justify-center"
          dangerouslySetInnerHTML={{ __html: `<i data-lucide="${kebabName}" class="${className}"></i>` }}
        />
      );
    };

    const createIconWrapper = (name) => {
      return (props) => <IconComponent name={name} {...props} />;

    const Plus = createIconWrapper('Plus');
    const Settings = createIconWrapper('Settings');

    const Check = createIconWrapper('Check');

    const Trash2 = createIconWrapper('Trash2');
    const X = createIconWrapper('X');
    const ChevronLeft = createIconWrapper('ChevronLeft');
    const Calendar = createIconWrapper('Calendar');
    const Compass = createIconWrapper('Compass');
    const Search = createIconWrapper('Search');
    const History = createIconWrapper('History');
    const HelpCircle = createIconWrapper('HelpCircle');
    const MapPin = createIconWrapper('MapPin');
    const Eye = createIconWrapper('Eye');
    const Edit2 = createIconWrapper('Edit2');
    const Play = createIconWrapper('Play');
    const Pause = createIconWrapper('Pause');
    const Bell = createIconWrapper('Bell');
    const Droplet = createIconWrapper('Droplet');
    const Fuel = createIconWrapper('Fuel');
    const Disc = createIconWrapper('Disc');
    const CircleDot = createIconWrapper('CircleDot');
    const Zap = createIconWrapper('Zap');
    const Thermometer = createIconWrapper('Thermometer');
    const ShieldAlert = createIconWrapper('ShieldAlert');
    const Sparkles = createIconWrapper('Sparkles');
    const MessageSquare = createIconWrapper('MessageSquare');
    const ChevronRight = createIconWrapper('ChevronRight');
    const Phone = createIconWrapper('Phone');
    const Star = createIconWrapper('Star');
    const Lock = createIconWrapper('Lock');
    const EyeOff = createIconWrapper('EyeOff');
    const LayoutDashboard = createIconWrapper('LayoutDashboard');

    const CURRENT_DATE_STRING = '2026-05-30';
    const CURRENT_DATE = new Date(CURRENT_DATE_STRING);

    // Helper to format odometer values
    const formatOdo = (val) => {
      if (val === undefined || val === null) return '0 km';
      return Number(val).toLocaleString('id-ID') + ' km';
    };

    // Initial default components for Nmax New
    const INITIAL_COMPONENTS_NMAX = [

      { id: 'oli-transmisi', name: 'Oli Transmisi', icon: 'RefreshCw', intervalKm: 8000, intervalMonths: 8, lastServiceOdo: 50000, lastServiceDate: '2025-09-30', warning: 'Gigi transmisi gardan aus, menimbulkan suara dengung keras dan kerusakan girbox.', advice: 'Disarankan ganti oli transmisi setiap 2 kali ganti oli mesin.' },

      { id: 'oli-shock', name: 'Oli Sokbreker', icon: 'Settings', intervalKm: 20000, intervalMonths: 24, lastServiceOdo: 49500, lastServiceDate: '2025-09-30', warning: 'Sokbreker keras atau ambles mentok, menurunkan kontrol kestabilan motor.', advice: 'Ganti oli sokbreker depan secara berkala beserta seal debunya.' }
    ];

    // Helper to calculate component status details
    const getComponentStatus = (comp, currentOdo) => {
      const elapsedKm = Math.max(0, currentOdo - comp.lastServiceOdo);
      const remainingKm = Math.max(0, comp.intervalKm - elapsedKm);
      
      const lastServiceDate = new Date(comp.lastServiceDate);
      const nextServiceDate = new Date(lastServiceDate);
      nextServiceDate.setMonth(nextServiceDate.getMonth() + comp.intervalMonths);
      
      const timeDiff = nextServiceDate.getTime() - CURRENT_DATE.getTime();
      const remainingDays = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
      
      const isUrgent = remainingKm <= 0 || remainingDays <= 0;
      
      return {
        remainingKm,
        remainingDays,
        nextServiceDate,
        isUrgent,
        elapsedKm
      };
    };

    // Component: ProgressBar Helper
    const ProgressBar = ({ percent, color = 'bg-iosBlue' }) => (
      <div className="w-full h-2.5 bg-white/[0.08] rounded-full overflow-hidden">
        <div 
          className={`h-full ${color} rounded-full transition-all duration-500`} 
          style={{ width: `${Math.min(100, Math.max(0, percent))}%` }}
        ></div>
      </div>
    );

    // Component: Switch / Toggle
    const Toggle = ({ active, onChange }) => (
      <button 
        onClick={onChange}
        className={`w-[51px] h-[31px] rounded-full p-[2px] transition-colors duration-350 flex-shrink-0 outline-none flex items-center ${active ? 'bg-iosGreen' : 'bg-[#3A3A3C]'}`}
      >
        <div className={`w-[27px] h-[27px] bg-white rounded-full shadow-md transition-transform duration-300 ${active ? 'translate-x-[20px]' : 'translate-x-0'}`}></div>
      </button>
    );

    // Main App Component
    function App() {
      // ----------------------------------------------------
      // STATE DECLARATIONS
      // ----------------------------------------------------
      
      // Auth states
      const [user, setUser] = React.useState(null);
      const [loadingAuth, setLoadingAuth] = React.useState(true);
      const [guestMode, setGuestMode] = React.useState(() => {
        return localStorage.getItem('motocare_guest') === 'true';
      });
      const [authMode, setAuthMode] = React.useState('login'); // 'login' | 'register' | 'forgot'
      const [authEmail, setAuthEmail] = React.useState('');
      const [authPassword, setAuthPassword] = React.useState('');
      const [authError, setAuthError] = React.useState('');
      const [toast, setToast] = React.useState(null);

      // showToast helper
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
      };

      // Active vehicle ID
      const [activeVehicleId, setActiveVehicleId] = React.useState(() => {
        const saved = localStorage.getItem('motocare_active_vehicle');

      const handleAddHistorySubmit = async (e) => {
        e.preventDefault();

        const serviceOdo = parseInt(fd.get('serviceOdo'), 10);
        const serviceCost = parseFloat(fd.get('serviceCost')) || 0;
        const serviceNotes = fd.get('serviceNotes');

        if (isNaN(serviceOdo) || serviceOdo < 0) {
          showToast('Odometer tidak valid', 'error');
          return;
        }

        if (selectedComponentsForLog.length === 0) {
          showToast('Pilih minimal satu komponen', 'error');
          return;
        }

        const userId = user?.id || null;

        const newLog = {
          id: 'h_' + Date.now(),
          vehicleId: activeVehicleId,
          date: serviceDate,
          odo: serviceOdo,
          components: selectedComponentsForLog,
          notes: serviceNotes,
          cost: serviceCost
        };

        try {
          await window.supabaseService.saveServiceLog(userId, activeVehicleId, newLog);
          setServiceHistory(prev => [newLog, ...prev]);

          setVehicleComponents(prev => {
            const currentVehicleComps = prev[activeVehicleId] || [];
            const updatedComps = currentVehicleComps.map(c => {
              if (selectedComponentsForLog.includes(c.name)) {
                const updatedComp = {
                  ...c,
                  lastServiceOdo: serviceOdo,
                  lastServiceDate: serviceDate
                };
                window.supabaseService.saveComponent(userId, activeVehicleId, updatedComp);
                return updatedComp;
              }
              return c;
            });
            return { ...prev, [activeVehicleId]: updatedComps };
          });

          if (serviceOdo > currentVehicle.odo) {

                const updatedVehicle = { ...v, odo: serviceOdo };

                return updatedVehicle;

                      name="serviceOdo"
                      defaultValue={currentVehicle.odo}
                      className="w-full glass-input py-2.5 px-3 text-xs font-semibold"
                    />
                  </div>
                </div>

                <div className="space-y-1.5 text-left">
                  <label className="text-[10px] text-iosGray uppercase tracking-wider font-extrabold">Total Biaya (Rp)</label>
                  <input 
                    type="number" 
                    name="serviceCost"
                    placeholder="Contoh: 150000"
                    className="w-full glass-input py-2.5 px-3 text-xs font-semibold"
                  />
                </div>

                <div className="space-y-2">
                  <label className="text-[10px] text-iosGray uppercase tracking-wider font-extrabold block text-left">Pilih Komponen yang Diservis</label>
                  <div className="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto p-1 border border-white/[0.05] rounded-ios bg-black/20">
                    {currentComponents.map(c => {
                      const isSelected = selectedComponentsForLog.includes(c.name);
                      return (
                        <div 
                          key={c.id}
                          onClick={() => {
                            setSelectedComponentsForLog(prev => 
                              prev.includes(c.name) ? prev.filter(name => name !== c.name) : [...prev, c.name]
                            );
                          }}
                          className={`p-2.5 rounded-ios-sm border flex items-center gap-2 cursor-pointer transition-all ${
                            isSelected 
                              ? 'bg-iosBlue/15 border-iosBlue text-white font-bold' 
                              : 'bg-white/[0.02] border-white/[0.06] text-iosGrayLight hover:bg-white/[0.04]'
                          }`}
                        >
                          <div className={`w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0 ${
                            isSelected ? 'bg-iosBlue text-white' : 'bg-white/[0.06] text-iosGray'
                          }`}>
                            <IconComponent name={c.icon} className="w-3 h-3" />
                          </div>
                          <span className="truncate text-[11px]">{c.name}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="space-y-1.5 text-left">
                  <label className="text-[10px] text-iosGray uppercase tracking-wider font-extrabold">Catatan Servis</label>
                  <textarea 
                    name="serviceNotes"
                    placeholder="Tulis detail servis (misal merek oli, keluhan, dll)..."
                    className="w-full glass-input py-2.5 px-3 text-xs font-semibold h-20 resize-none"
                  />
                </div>
              </div>

              <button 
                type="submit"
                className="w-full bg-iosBlue hover:bg-iosBlue/95 text-white py-4 rounded-full font-bold text-sm shadow-md active:scale-95 transition-transform"
              >
                Simpan Catatan Servis
              </button>
            </form>
          </div>
        </ModalWrapper>
      );

      // 10. Add Shop Modal
      const renderAddShopModal = () => (
        <ModalWrapper isOpen={showAddShopModal} onClose={() => setShowAddShopModal(false)}>
          <div className="w-full flex-1 flex flex-col overflow-hidden text-left">
            <div className="w-10 h-1 bg-white/20 rounded-full mx-auto my-3 md:hidden"></div>

            <div className="px-5 pb-3 pt-2 flex justify-between items-center border-b border-white/[0.06]">
              <h3 className="text-sm font-bold text-white uppercase tracking-wider">Tambah Bengkel</h3>
              <button 
                type="button"
                onClick={() => setShowAddShopModal(false)}
                className="w-7 h-7 bg-white/[0.06] rounded-full flex items-center justify-center text-iosGray hover:text-white"
              >
                <X className="w-4 h-4" />
              </button>
            </div>

            <form 
              onSubmit={handleAddShopSubmit}
              className="p-5 space-y-4 overflow-y-auto flex-1 text-xs"
            >
              <div className="space-y-3.5">
                <div className="space-y-1.5 text-left">
                  <label className="text-[10px] text-iosGray uppercase tracking-wider font-extrabold">Nama Bengkel</label>
                  <input 
                    type="text" 
                    required
                    name="shopName"
                    placeholder="Contoh: Bengkel Utama Motor"
                    className="w-full glass-input py-2.5 px-3 text-xs font-semibold placeholder-white/20"
                  />
                </div>

                <div className="space-y-1.5 text-left">
                  <label className="text-[10px] text-iosGray uppercase tracking-wider font-extrabold">Alamat</label>
                  <input 
                    type="text" 
                    required
                    name="shopAddress"
                    placeholder="Jl. Raya Sukabumi No. 10..."
                    className="w-full glass-input py-2.5 px-3 text-xs font-semibold placeholder-white/20"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="space-y-1.5 text-left">
                    <label className="text-[10px] text-iosGray uppercase tracking-wider font-extrabold">Telepon / WhatsApp</label>
                    <input 
                      type="text" 
                      name="shopPhone"
                      placeholder="0812..."
                      className="w-full glass-input py-2.5 px-3 text-xs font-semibold placeholder-white/20"
                    />
                  </div>
                  <div className="space-y-1.5 text-left">
                    <label className="text-[10px] text-iosGray uppercase tracking-wider font-extrabold">Rating</label>
                    <select 
                      name="shopRating"
                      defaultValue="4.5"
                      className="w-full glass-input py-2.5 px-3 text-xs font-semibold"
                    >
                      <option value="5.0">5.0 - Sangat Bagus</option>
                      <option value="4.5">4.5 - Bagus</option>
                      <option value="4.0">4.0 - Cukup</option>
                      <option value="3.5">3.5 - Biasa</option>
                      <option value="3.0">3.0 - Kurang</option>
                    </select>
                  </div>
                </div>

                <div className="space-y-1.5 text-left">
                  <label className="text-[10px] text-iosGray uppercase tracking-wider font-extrabold">Promo Spesial / Catatan</label>
                  <textarea 
                    name="shopNotes"
                    placeholder="Tulis promo atau layanan andalan (misal: Diskon Oli 10%)..."
                    className="w-full glass-input py-2.5 px-3 text-xs font-semibold h-20 resize-none"
                  />
                </div>
              </div>

              <button 
                type="submit"
                className="w-full bg-iosBlue hover:bg-iosBlue/95 text-white py-4 rounded-full font-bold text-sm shadow-md active:scale-95 transition-transform"
              >
                Simpan Bengkel Favorit
              </button>
            </form>
          </div>
        </ModalWrapper>
      );

      // 10.5 Add Standard Component List Modal
      const renderAddStandardComponentListModal = () => (
        <ModalWrapper isOpen={showAddStandardList} onClose={() => setShowAddStandardList(false)}>
          <div className="w-full flex-1 flex flex-col overflow-hidden text-left">
            <div className="w-10 h-1 bg-white/20 rounded-full mx-auto my-3 md:hidden"></div>

            <div className="px-5 pb-3 pt-2 flex items-center justify-between border-b border-white/[0.06]">
              <h3 className="text-sm font-bold text-white uppercase tracking-wider">Pilih Komponen Standar</h3>
              <button 
                type="button"
                onClick={() => setShowAddStandardList(false)}
                className="w-7 h-7 bg-white/[0.06] rounded-full flex items-center justify-center text-iosGray hover:text-white"
              >
                <X className="w-4 h-4" />
              </button>
            </div>

            <div className="p-5 space-y-3 overflow-y-auto flex-1 text-xs">
              <p className="text-iosGray text-xs pb-2">Pilih komponen standar berikut untuk ditambahkan ke daftar pemantauan kendaraan Anda:</p>
              
              <div className="space-y-2">
                {STANDARD_ADDABLE_COMPONENTS.map((comp, idx) => {
                  const exists = currentComponents.some(c => c.name.toLowerCase() === comp.name.toLowerCase());
                  return (
                    <div 
                      key={idx}
                      onClick={() => {
                        if (!exists) {
                          setCurrentComponentForm(comp);
                          setShowAddStandardList(false);
                        }
                      }}
                      className={`p-3.5 rounded-[20px] border flex items-center justify-between transition-all ${
                        exists 
                          ? 'bg-white/[0.02] border-white/[0.04] opacity-50 cursor-not-allowed' 
                          : 'bg-[#1C1C1E] border-white/[0.06] hover:border-iosBlue hover:bg-white/[0.02] cursor-pointer'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <div className="w-9 h-9 rounded-full bg-iosBlue/10 text-iosBlue flex items-center justify-center flex-shrink-0">
                          <IconComponent name={comp.icon} className="w-4.5 h-4.5" />
                        </div>
                        <div>
                          <h4 className="font-bold text-xs text-white">{comp.name}</h4>
                          <span className="text-[10px] text-iosGray">Interval: {comp.intervalKm.toLocaleString('id-ID')} km / {comp.intervalMonths} bulan</span>
                        </div>
                      </div>
                      
                      {exists ? (
                        <span className="text-[9px] bg-white/[0.06] text-iosGray px-2 py-0.5 rounded-full">Sudah Ada</span>
                      ) : (
                        <ChevronRight className="w-4 h-4 text-iosGray" />
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
            
            <div className="p-4 border-t border-white/[0.06] bg-black/20">
              <button 
                type="button"
                onClick={() => {
                  setShowAddStandardList(false);
                  setShowAddCustomComponent(true);
                }}
                className="w-full bg-iosBlue/15 hover:bg-iosBlue/25 text-iosBlue py-3 rounded-full font-bold text-xs text-center active:scale-95 transition-transform"
              >
                + Buat Komponen Kustom
              </button>
            </div>
          </div>
        </ModalWrapper>
      );

      // Render Auth Screen or Loading
      if (loadingAuth) {
        return (
          <div className="min-h-screen w-full flex flex-col items-center justify-center bg-[#050506] text-white">
            <div className="w-16 h-16 border-4 border-t-iosBlue border-r-transparent border-b-transparent border-l-transparent rounded-full animate-spin"></div>
            <p className="mt-4 text-iosGray text-sm tracking-wide">Memuat MotoCare...</p>
          </div>
        );
      }

      if (!user && !guestMode) {
        return renderAuthScreen();
      }

      // MAIN RENDER
      return (
        <div className="w-full min-h-screen flex flex-col md:flex-row text-white font-sans md:h-screen md:overflow-hidden bg-transparent">
          
          {/* 1. Left Sidebar (Desktop Only) */}
          {renderDesktopSidebar()}

          {/* 2. Main Content Viewport */}
          <div className="flex-1 flex flex-col min-w-0 md:overflow-hidden relative">
            
            {/* Mobile Header (< 768px) */}
            {renderMobileHeader()}

            {/* Desktop Header (>= 768px) */}
            {renderDesktopHeader()}

            {/* Scrollable content split (Mobile scrolls at window-level naturally, Desktop is locked) */}
            <div className="flex-1 flex flex-col xl:flex-row md:overflow-y-auto pb-[120px] md:pb-0">
              
              {/* Central Area */}
              <div className="flex-1 px-4 py-5 md:p-5 lg:p-8 space-y-6">
                {/* Desktop Dashboard cards */}
                {activeTab === 'ride' && (
                  <div className="hidden md:block">
                    {renderDesktopDashboardMetrics()}
                  </div>
                )}

                {/* Main active tab view */}
                {renderTabContent()}
              </div>

              {/* Right Panel (Desktop 'ride' Dashboard Only, >= 1280px) */}
              {activeTab === 'ride' && renderDesktopRightPanel()}

            </div>
          </div>

          {/* 3. Mobile Bottom navigation (< 768px) - Position Fixed to viewport */}
          {renderMobileBottomNav()}

          {/* 4. Floating search action button (Mobile only) - Position Fixed with locked bounds */}
          {!selectionMode && (
            <button 
              onClick={() => {
                setActiveTab('search');
              }}
              className="mobile-search-btn glass-strong flex items-center justify-center text-iosBlue shadow-2xl active:scale-90 transition-transform cursor-pointer md:hidden"
            >
              <Search className="w-6 h-6 text-white" />
            </button>
          )}

          {/* 5. Batch selection floating panel */}
          {selectionMode && (
            <div className="fixed bottom-[16px] left-[50%] -translate-x-[50%] w-[calc(100%-32px)] max-w-[360px] glass-strong rounded-full p-4 flex items-center justify-between shadow-2xl z-[120] animate-slideUp md:hidden">
              <button 
                onClick={handleBatchDelete}
                disabled={selectedComponents.length === 0}
                className="w-11 h-11 bg-iosRed/10 hover:bg-iosRed/20 text-iosRed rounded-full flex items-center justify-center disabled:opacity-40 transition-colors"
              >
                <Trash2 className="w-5 h-5" />
              </button>

              <div className="flex-1 text-center">
                <span className="text-xs font-bold text-white block">{selectedComponents.length} Pilih</span>
                <span className="text-[9px] text-iosGray">Servis {currentVehicle.odo.toLocaleString()} km</span>
              </div>

              <button 
                onClick={handleBatchService}
                disabled={selectedComponents.length === 0}
                className="bg-iosBlue hover:bg-iosBlue/95 text-white font-bold text-[10px] py-2.5 px-4.5 rounded-full disabled:opacity-40 shadow transition-all active:scale-95"
              >
                Servis ({selectedComponents.length})
              </button>
            </div>
          )}

          {/* Mount Modals & Sheets (Shared with responsive centering in Desktop) */}
          {renderMobileSearchOverlay()}
          {renderOdoSettingModal()}
          {renderShopDetailSheet()}
          {renderComponentDetailModal()}
          {renderComponentFormModal()}
          {renderAddCustomComponentModal()}
          {renderAddVehicleModal()}
          {renderAddHistoryModal()}
          {renderAddShopModal()}
          {renderAddStandardComponentListModal()}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[200] max-w-[90%] w-auto bg-iosCard/90 backdrop-blur-md border border-white/[0.12] shadow-2xl rounded-full py-2.5 px-5 flex items-center gap-2.5 animate-popover">
              <div className={`w-2.5 h-2.5 rounded-full ${toast.type === 'error' ? 'bg-iosRed' : 'bg-iosGreen animate-pulse'}`}></div>
              <span className="text-xs font-bold text-white whitespace-nowrap">{toast.message}</span>
            </div>
          )}
        </div>
      );
    }

    // Mount React App to DOM root
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
